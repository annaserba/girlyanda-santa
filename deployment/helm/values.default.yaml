generic:
  extraImagePullSecrets:
    - name: harbor-auth-secret
  podAnnotations:
    checksum/envs: '{{ include "helpers.workload.checksum" (toJson $.Values.envs) }}'

# Concrete image and origin are supplied by the rendered Argo CD Application.
image:
  name: example.invalid/girlyanda/app
  tag: not-configured

envs:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  BETTER_AUTH_URL: https://santa.example.invalid
  NEXT_PUBLIC_APP_URL: https://santa.example.invalid
  EXTERNAL_SECRETS_PATH: gsp/girlyanda/not-configured

services:
  app:
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: 3000
    extraSelectorLabels:
      app: girlyanda

deployments:
  app:
    replicas: 1
    # One in-process scheduler; never run two migrations during a rolling update.
    strategy:
      type: Recreate
    terminationGracePeriodSeconds: 30
    extraSelectorLabels:
      app: girlyanda
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    initContainers:
      migration:
        name: migration
        command: ["node", "dist-migrate.cjs"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 256Mi
        envsFromSecret:
          secret:
            - DATABASE_URL
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
    containers:
      app:
        name: app
        # Override Docker CMD: the init container already applied migrations.
        command: ["node", "server.js"]
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        startupProbe:
          httpGet:
            path: /api/health/liveness
            port: 3000
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/health/liveness
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/readiness
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 7
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
        envsFromConfigmap:
          envs:
            - NODE_ENV
            - PORT
            - HOSTNAME
            - NEXT_TELEMETRY_DISABLED
            - BETTER_AUTH_URL
            - NEXT_PUBLIC_APP_URL
        envsFromSecret:
          secret:
            - DATABASE_URL
            - BETTER_AUTH_SECRET
            - ADMIN_EMAIL
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

ingresses:
  app:
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - hostname: santa.example.invalid
        paths:
          - path: /
            servicePort: 80
            serviceName: app
    extraTls:
      - hosts: [santa.example.invalid]
        secretName: girlyanda-tls

extraDeploy:
  external-secret: |-
    apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: {{ .Release.Name }}-secret
      namespace: {{ .Release.Namespace }}
    spec:
      refreshInterval: 60s
      secretStoreRef:
        kind: ClusterSecretStore
        name: vault-secret-store
      target:
        name: {{ .Release.Name }}-secret
        template:
          engineVersion: v2
          type: Opaque
      data:
        - remoteRef:
            key: {{ .Values.envs.EXTERNAL_SECRETS_PATH }}
            property: DATABASE_URL
          secretKey: DATABASE_URL
        - remoteRef:
            key: {{ .Values.envs.EXTERNAL_SECRETS_PATH }}
            property: BETTER_AUTH_SECRET
          secretKey: BETTER_AUTH_SECRET
        - remoteRef:
            key: {{ .Values.envs.EXTERNAL_SECRETS_PATH }}
            property: ADMIN_EMAIL
          secretKey: ADMIN_EMAIL
